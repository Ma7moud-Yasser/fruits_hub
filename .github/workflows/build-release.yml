name: Build and Upload Release APK

on:
  push:
    branches:
      - "*"

jobs:
  build_release:
    if: contains(github.event.head_commit.message, 'build release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Analyzer
        run: flutter analyze
        continue-on-error: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            build/
            android/.gradle
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/*.gradle*', 'pubspec.lock') }}

      - name: Build release APK
        run: flutter build apk --release

      - name: Extract Folder ID from commit message
        id: extract_folder
        run: |
          FOLDER_ID=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'FOLDER_ID=\K\S+')
          echo "folder_id=$FOLDER_ID" >> $GITHUB_OUTPUT

      - name: Write Google credentials to file
        run: echo '${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}' > credentials.json

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install required Python packages
        run: |
          pip install --upgrade google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Upload APK to Google Drive & Send Email
        env:
          FOLDER_ID: ${{ steps.extract_folder.outputs.folder_id }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          cat > upload_and_email.py <<EOF
import os
import smtplib
from email.mime.text import MIMEText
from google.oauth2 import service_account
from googleapiclient.discovery import build
from googleapiclient.http import MediaFileUpload

# Google Drive Upload
FOLDER_ID = os.environ['FOLDER_ID']
SCOPES = ['https://www.googleapis.com/auth/drive.file']
SERVICE_ACCOUNT_FILE = 'credentials.json'

credentials = service_account.Credentials.from_service_account_file(SERVICE_ACCOUNT_FILE, scopes=SCOPES)
service = build('drive', 'v3', credentials=credentials)

ref_name = os.environ.get('GITHUB_REF_NAME', 'unknown-branch')
file_name = f"app-release-{ref_name}.apk"
file_metadata = {
    'name': file_name,
    'parents': [FOLDER_ID]
}
media = MediaFileUpload('build/app/outputs/flutter-apk/app-release.apk', mimetype='application/vnd.android.package-archive')
service.files().create(body=file_metadata, media_body=media, fields='id').execute()

# Send Email
email_user = os.environ['EMAIL_USER']
email_pass = os.environ['EMAIL_PASS']
email_receiver = os.environ['EMAIL_RECEIVER']

subject = f"APK Uploaded: {ref_name}"
body = "Your APK has been successfully uploaded to Google Drive."

msg = MIMEText(body)
msg['Subject'] = subject
msg['From'] = email_user
msg['To'] = email_receiver

with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
    server.login(email_user, email_pass)
    server.sendmail(email_user, email_receiver.split(','), msg.as_string())
EOF

          python upload_and_email.py
